name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # One install for every workspace — the same resolution the Vercel build uses,
      # so a dependency declared in the wrong place fails here and not in production.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  worker:
    name: Stem separator worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The GPU model itself cannot run here; these cover the pure logic that
      # decides stem identity and alignment, which is where silent drift comes from.
      - name: Install test dependencies
        run: pip install numpy soundfile

      - name: Unit tests
        working-directory: workers/stem-separator
        run: python -m unittest discover -p "test_*.py" -v

  infra:
    name: CloudFormation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Lint templates
        run: cfn-lint infra/aws/*.yaml
