AWSTemplateFormatVersion: '2010-09-09'
Description: Allegra shared AWS resources: DynamoDB, SSM, ECR, IAM, and billing guardrail.

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    AllowedPattern: '[a-z0-9-]+'
  BillingAlertEmail:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$'
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 16
  SaavnApiUrl:
    Type: String
    NoEcho: true
  GaanaApiUrl:
    Type: String
    NoEcho: true
  LrclibApiUrl:
    Type: String
    Default: https://lrclib.net/api

Conditions:
  HasBillingAlertEmail: !Not [!Equals [!Ref BillingAlertEmail, '']]

Resources:
  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub allegra-cache-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cacheKey
          AttributeType: S
      KeySchema:
        - AttributeName: cacheKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub allegra-users-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName

  LibrariesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub allegra-libraries-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: libraryId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: libraryId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName

  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub allegra-api-${EnvironmentName}
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EmptyOnDelete: true
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName

  AppRunnerEcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub allegra-apprunner-ecr-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pull-api-image
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt ApiRepository.Arn

  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub allegra-apprunner-instance-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-allegra-runtime-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt CacheTable.Arn
                  - !GetAtt UsersTable.Arn
                  - !GetAtt LibrariesTable.Arn
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/allegra/${EnvironmentName}/*

  JwtSecretParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /allegra/${EnvironmentName}/JWT_SECRET
      Type: SecureString
      Value: !Ref JwtSecret
      Tier: Standard
      Tags:
        app: allegra
        environment: !Ref EnvironmentName

  SaavnApiUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /allegra/${EnvironmentName}/SAAVN_API_URL
      Type: String
      Value: !Ref SaavnApiUrl
      Tier: Standard
      Tags:
        app: allegra
        environment: !Ref EnvironmentName

  GaanaApiUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /allegra/${EnvironmentName}/GAANA_API_URL
      Type: String
      Value: !Ref GaanaApiUrl
      Tier: Standard
      Tags:
        app: allegra
        environment: !Ref EnvironmentName

  LrclibApiUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /allegra/${EnvironmentName}/LRCLIB_API_URL
      Type: String
      Value: !Ref LrclibApiUrl
      Tier: Standard
      Tags:
        app: allegra
        environment: !Ref EnvironmentName

  BillingBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBillingAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub allegra-${EnvironmentName}-10-usd-alert
        BudgetLimit:
          Amount: 10
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
        CostFilters:
          TagKeyValue:
            - !Sub user:app$allegra
        NotificationsWithSubscribers:
          - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              Threshold: 80
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: !Ref BillingAlertEmail
          - Notification:
              NotificationType: FORECASTED
              ComparisonOperator: GREATER_THAN
              Threshold: 100
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: !Ref BillingAlertEmail

Outputs:
  ApiRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
  ApiRepositoryArn:
    Value: !GetAtt ApiRepository.Arn
  AppRunnerEcrAccessRoleArn:
    Value: !GetAtt AppRunnerEcrAccessRole.Arn
  AppRunnerInstanceRoleArn:
    Value: !GetAtt AppRunnerInstanceRole.Arn
  CacheTableName:
    Value: !Ref CacheTable
  UsersTableName:
    Value: !Ref UsersTable
  LibrariesTableName:
    Value: !Ref LibrariesTable
  JwtSecretParameterArn:
    Value: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/allegra/${EnvironmentName}/JWT_SECRET
  SaavnApiUrlParameterArn:
    Value: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/allegra/${EnvironmentName}/SAAVN_API_URL
  GaanaApiUrlParameterArn:
    Value: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/allegra/${EnvironmentName}/GAANA_API_URL
  LrclibApiUrlParameterArn:
    Value: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/allegra/${EnvironmentName}/LRCLIB_API_URL
