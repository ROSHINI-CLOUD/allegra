AWSTemplateFormatVersion: '2010-09-09'
Description: Allegra karaoke stem separation — Spot GPU Batch CE, queue, job definition, S3, IAM, logs.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedPattern: '[a-z0-9-]+'
    Description: Environment suffix for resource names (e.g. dev, prod).
  ImageUri:
    Type: String
    Description: >
      ECR image URI for the stem-separator worker, pinned by git sha
      (e.g. 123456789012.dkr.ecr.ap-south-1.amazonaws.com/allegra-stem-separator-dev:abc1234).
  MaxvCpus:
    Type: Number
    Default: 4
    MinValue: 0
    MaxValue: 64
    Description: >
      Max vCPUs for the Spot CE. g4dn.xlarge is 4 vCPU / 1 GPU — default 4 allows
      one concurrent GPU worker (safe for hackathon/dev).

  MonthlyBudgetUsd:
    Type: Number
    Default: 25
    MinValue: 1
    Description: Monthly cost budget (USD) for resources tagged app=allegra. Alerts at 80% actual and 100% forecast.
  BudgetEmail:
    Type: String
    Default: ''
    Description: Email for budget alerts. Leave blank to skip creating the budget.

Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, '']]

Resources:
  # --- Networking (self-contained; region-agnostic via AWS::Region / GetAZs) ---
  KaraokeVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName
        - Key: Name
          Value: !Sub allegra-karaoke-vpc-${EnvironmentName}

  KaraokeInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName

  KaraokeVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref KaraokeVpc
      InternetGatewayId: !Ref KaraokeInternetGateway

  KaraokeSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref KaraokeVpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName
        - Key: Name
          Value: !Sub allegra-karaoke-subnet-a-${EnvironmentName}

  KaraokeSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref KaraokeVpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName
        - Key: Name
          Value: !Sub allegra-karaoke-subnet-b-${EnvironmentName}

  KaraokePublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref KaraokeVpc
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName

  KaraokeDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: KaraokeVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref KaraokePublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref KaraokeInternetGateway

  KaraokeSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref KaraokeSubnetA
      RouteTableId: !Ref KaraokePublicRouteTable

  KaraokeSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref KaraokeSubnetB
      RouteTableId: !Ref KaraokePublicRouteTable

  KaraokeBatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub Allegra karaoke Batch workers (${EnvironmentName}) - egress only
      VpcId: !Ref KaraokeVpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName

  # --- S3: stems + staged input ---
  KaraokeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub allegra-karaoke-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # Staging objects from the API — expire; keep final karaoke/ stems.
          - Id: expire-karaoke-input
            Status: Enabled
            Prefix: karaoke-input/
            ExpirationInDays: 3
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName

  # --- ECR for the worker image (push tagged by git sha; JobDefinition uses ImageUri) ---
  StemSeparatorRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub allegra-stem-separator-${EnvironmentName}
      ImageScanningConfiguration:
        ScanOnPush: true
      # Immutable: a git-sha tag always means the same bytes, so the job definition
      # can never silently run different code than what was reviewed.
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName

  # --- CloudWatch Logs ---
  KaraokeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /allegra/karaoke-batch/${EnvironmentName}
      RetentionInDays: 14
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName

  # --- IAM: Batch service ---
  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub allegra-karaoke-batch-service-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: batch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName

  # --- IAM: Spot fleet tagging (required for Spot CE) ---
  SpotFleetRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub allegra-karaoke-spot-fleet-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: spotfleet.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2SpotFleetTaggingRole
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName

  # --- IAM: EC2 instance profile for ECS Batch hosts ---
  BatchInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub allegra-karaoke-batch-instance-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName

  BatchInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub allegra-karaoke-batch-instance-${EnvironmentName}
      Roles:
        - !Ref BatchInstanceRole

  # --- IAM: ECS task execution (ECR pull + logs) ---
  BatchJobExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub allegra-karaoke-batch-exec-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ecr-pull-and-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt StemSeparatorRepository.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt KaraokeLogGroup.Arn
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName

  # --- IAM: job/task role (least-priv S3 + CW logs) ---
  BatchJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub allegra-karaoke-batch-job-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: karaoke-s3-and-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub ${KaraokeBucket.Arn}/karaoke-input/*
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub ${KaraokeBucket.Arn}/karaoke/*
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt KaraokeLogGroup.Arn
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName

  # --- Batch compute environment (Spot GPU, scale to zero) ---
  KaraokeComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    DependsOn:
      - KaraokeSubnetARouteAssoc
      - KaraokeSubnetBRouteAssoc
    Properties:
      ComputeEnvironmentName: !Sub allegra-karaoke-spot-${EnvironmentName}
      Type: MANAGED
      State: ENABLED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: SPOT
        AllocationStrategy: SPOT_PRICE_CAPACITY_OPTIMIZED
        MinvCpus: 0
        DesiredvCpus: 0
        MaxvCpus: !Ref MaxvCpus
        InstanceTypes:
          - g4dn.xlarge
        Subnets:
          - !Ref KaraokeSubnetA
          - !Ref KaraokeSubnetB
        SecurityGroupIds:
          - !Ref KaraokeBatchSecurityGroup
        InstanceRole: !GetAtt BatchInstanceProfile.Arn
        SpotIamFleetRole: !GetAtt SpotFleetRole.Arn
        # Ec2Configuration intentionally omitted: Batch then picks its current
        # recommended GPU-enabled ECS AMI for g4dn. Pinning ECS_AL2_NVIDIA would tie
        # us to Amazon Linux 2, which is past its end of support.
        Tags:
          app: allegra
          environment: !Ref EnvironmentName

  KaraokeJobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: !Sub allegra-karaoke-${EnvironmentName}
      State: ENABLED
      Priority: 1
      # A job that cannot get Spot GPU capacity waits in RUNNABLE indefinitely.
      # Cancel it after 30 min so the user sees a retryable failure, not a spinner.
      JobStateTimeLimitActions:
        - Action: CANCEL
          MaxTimeSeconds: 1800
          Reason: CAPACITY:INSUFFICIENT_INSTANCE_CAPACITY
          State: RUNNABLE
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref KaraokeComputeEnvironment
      Tags:
        app: allegra
        environment: !Ref EnvironmentName

  # g4dn.xlarge: 4 vCPU, 16 GiB RAM, 1 GPU. Leave a little memory for the agent.
  KaraokeJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: !Sub allegra-stem-separator-${EnvironmentName}
      Type: container
      PlatformCapabilities:
        - EC2
      PropagateTags: true
      # Retry ONLY when the Spot host is reclaimed. Model/audio/storage failures are
      # deterministic — retrying them just burns GPU time — so they exit immediately
      # and the API surfaces the worker's exit code (10-13) as the error class.
      RetryStrategy:
        Attempts: 3
        EvaluateOnExit:
          - OnStatusReason: Host EC2*
            Action: RETRY
          - OnReason: '*'
            Action: EXIT
      Timeout:
        AttemptDurationSeconds: 3600
      ContainerProperties:
        Image: !Ref ImageUri
        Privileged: false
        ResourceRequirements:
          - Type: VCPU
            Value: '4'
          - Type: MEMORY
            Value: '14400'
          - Type: GPU
            Value: '1'
        JobRoleArn: !GetAtt BatchJobRole.Arn
        ExecutionRoleArn: !GetAtt BatchJobExecutionRole.Arn
        Environment:
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: KARAOKE_S3_BUCKET
            Value: !Ref KaraokeBucket
          - Name: MODEL_DIR
            Value: /models
          - Name: WORK_DIR
            Value: /tmp/stem-work
          - Name: WORKER_VERSION
            Value: '1'
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref KaraokeLogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: stem
      Tags:
        app: allegra
        environment: !Ref EnvironmentName

  # --- IAM: what the API (Vercel function) is allowed to do ---
  # Vercel has no instance role, so the API authenticates with access keys for this
  # user. Keys are created out-of-band (aws iam create-access-key) and never live in
  # this template. Scope is exactly: stage input, claim/read state, read stems,
  # submit + describe jobs.
  KaraokeApiPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub allegra-karaoke-api-${EnvironmentName}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: StageInputAndClaimState
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource:
              - !Sub ${KaraokeBucket.Arn}/karaoke-input/*
              - !Sub ${KaraokeBucket.Arn}/karaoke-state/*
          - Sid: ReleaseFailedClaim
            Effect: Allow
            Action: s3:DeleteObject
            Resource: !Sub ${KaraokeBucket.Arn}/karaoke-state/*
          - Sid: ReadStems
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub ${KaraokeBucket.Arn}/karaoke/*
          # Without ListBucket, S3 answers 403 (not 404) for missing keys, which the
          # provider would misread as an outage instead of "not generated yet".
          - Sid: DistinguishMissingFromDenied
            Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt KaraokeBucket.Arn
          - Sid: SubmitOnlyToThisQueue
            Effect: Allow
            Action: batch:SubmitJob
            Resource:
              - !Ref KaraokeJobQueue
              - !Sub arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/allegra-stem-separator-${EnvironmentName}
              - !Sub arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/allegra-stem-separator-${EnvironmentName}:*
          - Sid: DescribeJobs
            Effect: Allow
            Action: batch:DescribeJobs
            Resource: '*'

  KaraokeApiUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub allegra-karaoke-api-${EnvironmentName}
      ManagedPolicyArns:
        - !Ref KaraokeApiPolicy
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: !Ref EnvironmentName

  KaraokeBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub allegra-karaoke-${EnvironmentName}
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        CostFilters:
          TagKeyValue:
            - user:app$allegra
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  KaraokeApiUserName:
    Description: IAM user for the API. Create its access key with `aws iam create-access-key`, then set KARAOKE_AWS_ACCESS_KEY_ID / KARAOKE_AWS_SECRET_ACCESS_KEY on Vercel.
    Value: !Ref KaraokeApiUser
  KaraokeBucketName:
    Description: S3 bucket for karaoke-input staging and karaoke/ stems
    Value: !Ref KaraokeBucket
    Export:
      Name: !Sub allegra-karaoke-bucket-${EnvironmentName}
  JobQueueArn:
    Description: Batch job queue ARN — set AWS_BATCH_JOB_QUEUE on the API
    Value: !Ref KaraokeJobQueue
    Export:
      Name: !Sub allegra-karaoke-queue-${EnvironmentName}
  JobQueueName:
    Description: Batch job queue name
    Value: !Sub allegra-karaoke-${EnvironmentName}
  JobDefinitionArn:
    Description: Batch job definition ARN — set AWS_BATCH_JOB_DEFINITION on the API
    Value: !Ref KaraokeJobDefinition
    Export:
      Name: !Sub allegra-karaoke-jobdef-${EnvironmentName}
  JobDefinitionName:
    Description: Batch job definition name (revision included in Ref ARN)
    Value: !Sub allegra-stem-separator-${EnvironmentName}
  EcrRepositoryUri:
    Description: Push stem-separator images here; pass ImageUri on deploy/update
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${StemSeparatorRepository}
  LogGroupName:
    Description: CloudWatch log group for worker containers
    Value: !Ref KaraokeLogGroup
  ComputeEnvironmentArn:
    Description: Spot GPU compute environment (min/desired 0 vCPU)
    Value: !Ref KaraokeComputeEnvironment
