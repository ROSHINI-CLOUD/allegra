AWSTemplateFormatVersion: '2010-09-09'
Description: Allegra API App Runner service and CloudWatch dashboard.

Parameters:
  ServiceName:
    Type: String
    Default: allegra-api-prod
  ImageIdentifier:
    Type: String
    Description: ECR image URI, for example 123456789012.dkr.ecr.ap-south-1.amazonaws.com/allegra-api-prod:latest
  EcrAccessRoleArn:
    Type: String
  InstanceRoleArn:
    Type: String
  JwtSecretParameterArn:
    Type: String
  SaavnApiUrlParameterArn:
    Type: String
  GaanaApiUrlParameterArn:
    Type: String
  LrclibApiUrlParameterArn:
    Type: String
  CacheTableName:
    Type: String
  UsersTableName:
    Type: String
  LibrariesTableName:
    Type: String
  AllegraOrigin:
    Type: String
    AllowedPattern: '^https://[^/]+$'
  AppVersion:
    Type: String
    Default: 0.1.0

Resources:
  ApiService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Ref ServiceName
      SourceConfiguration:
        AutoDeploymentsEnabled: true
        AuthenticationConfiguration:
          AccessRoleArn: !Ref EcrAccessRoleArn
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: '8080'
            RuntimeEnvironmentVariables:
              NODE_ENV: production
              PORT: '8080'
              APP_VERSION: !Ref AppVersion
              ALLEGRA_ORIGIN: !Ref AllegraOrigin
              AWS_REGION: !Ref AWS::Region
              DDB_TABLE_CACHE: !Ref CacheTableName
              DDB_TABLE_USERS: !Ref UsersTableName
              DDB_TABLE_LIBRARIES: !Ref LibrariesTableName
            RuntimeEnvironmentSecrets:
              JWT_SECRET: !Ref JwtSecretParameterArn
              SAAVN_API_URL: !Ref SaavnApiUrlParameterArn
              GAANA_API_URL: !Ref GaanaApiUrlParameterArn
              LRCLIB_API_URL: !Ref LrclibApiUrlParameterArn
      InstanceConfiguration:
        # Hackathon / low-traffic default. Scale up only if CPU/latency dashboards demand it.
        Cpu: 0.25 vCPU
        Memory: 0.5 GB
        InstanceRoleArn: !Ref InstanceRoleArn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /api/health
        Interval: 20
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      Tags:
        - Key: app
          Value: allegra
        - Key: environment
          Value: prod

  ApiDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub allegra-${ServiceName}
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {
                "type": "metric",
                "x": 0,
                "y": 0,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "API requests and errors",
                  "view": "timeSeries",
                  "region": "${AWS::Region}",
                  "stat": "Sum",
                  "period": 60,
                  "metrics": [
                    [ "AWS/AppRunner", "RequestCount", "ServiceName", "${AppRunnerServiceName}" ],
                    [ ".", "5xxStatusResponses", ".", ".", { "yAxis": "right" } ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 0,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "API latency and resources",
                  "view": "timeSeries",
                  "region": "${AWS::Region}",
                  "stat": "Average",
                  "period": 60,
                  "metrics": [
                    [ "AWS/AppRunner", "RequestLatency", "ServiceName", "${AppRunnerServiceName}" ],
                    [ ".", "CPUUtilization", ".", ".", { "yAxis": "right" } ],
                    [ ".", "MemoryUtilization", ".", ".", { "yAxis": "right" } ]
                  ]
                }
              }
            ]
          }
        - AppRunnerServiceName: !GetAtt ApiService.ServiceName

Outputs:
  ServiceUrl:
    Value: !GetAtt ApiService.ServiceUrl
  ServiceArn:
    Value: !Ref ApiService
  ServiceName:
    Value: !GetAtt ApiService.ServiceName
  DashboardName:
    Value: !Sub allegra-${ServiceName}
